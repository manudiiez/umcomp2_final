[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loghunter"
version = "0.1.0"
description = "Analizador distribuido de logs para Computación II"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34,<2",
    "celery[redis]>=5.4,<6",
]

[project.urls]
Repository = "https://github.com/manudiiez/umcomp2_final"
Issues = "https://github.com/manudiiez/umcomp2_final/issues"

[dependency-groups]
dev = [
    "moto[s3]>=5.0,<6",
    "pytest>=8.4,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.uv]
required-version = ">=0.8.0"
